<svg xmlns="http://www.w3.org/2000/svg" width="440" height="416" viewBox="0 0 440 416" fill="none">
<style>
text{font-family:Inter,'Segoe UI','Helvetica Neue',Arial,sans-serif} .m{font-family:'JetBrains Mono','SF Mono',Menlo,Consolas,monospace} .pre{white-space:pre}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes steam{0%{opacity:0;transform:translateY(8px)}40%{opacity:.9}100%{opacity:0;transform:translateY(-12px)}}
@keyframes sway{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes floaty{0%,100%{transform:translateY(0) rotate(0)}50%{transform:translateY(-5px) rotate(8deg)}}
@keyframes show{0%,3%{opacity:0;transform:translateX(-8px)}10%,88%{opacity:1;transform:translateX(0)}96%,100%{opacity:0}}
@keyframes caret{0%,49%{opacity:1}50%,100%{opacity:0}}
.bob{animation:bob 5s ease-in-out infinite}
.eye{animation:blink 5s infinite;transform-box:fill-box;transform-origin:center}
.pl{animation:pulse 2s ease-in-out infinite}
.st1{animation:steam 3s ease-in-out infinite} .st2{animation:steam 3s ease-in-out infinite .9s} .st3{animation:steam 3s ease-in-out infinite 1.8s}
.sway{animation:sway 4s ease-in-out infinite;transform-box:fill-box;transform-origin:50% 100%}
.fl{animation:floaty 5s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.fl2{animation:floaty 6.5s ease-in-out infinite 1s;transform-box:fill-box;transform-origin:center}
.ln{animation:show 9s ease-in-out infinite}
.cr{animation:caret 1s steps(1) infinite}

</style>
<defs><filter id="blur" x="-80%" y="-80%" width="260%" height="260%"><feGaussianBlur stdDeviation="34"/></filter>
<filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B9ADFF"/><stop offset=".55" stop-color="#FF9FB2"/><stop offset="1" stop-color="#FFC8A2"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#9A8BFF" stop-opacity="0.75"/><stop offset=".55" stop-color="#FF8FA3" stop-opacity="0.35"/><stop offset="1" stop-color="#4FE3C1" stop-opacity="0.65"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.35"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
<pattern id="dg" width="16" height="16" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.1" fill="#FFFFFF" fill-opacity="0.07"/></pattern><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7C6BFF"/><stop offset="1" stop-color="#FF6F8E"/></linearGradient></defs><clipPath id="c0"><rect x="3" y="3" width="434" height="410" rx="26"/></clipPath><g clip-path="url(#c0)"><rect x="3" y="3" width="434" height="410" fill="#14152A"/><circle cx="394" cy="36" r="226" fill="#7C6BFF" opacity="0.45" filter="url(#blur)"/><circle cx="25" cy="413" r="205" fill="#FF6F8E" opacity="0.38" filter="url(#blur)"/><rect x="3" y="3" width="434" height="410" fill="url(#dg)"/></g><rect x="3" y="3" width="434" height="410" rx="26" fill="#FFFFFF" fill-opacity="0.045"/><rect x="3.75" y="3.75" width="432.5" height="408.5" rx="25.25" stroke="url(#bd)" stroke-width="1.5"/><rect x="29" y="4" width="382" height="1.2" fill="url(#hl)"/><rect x="28" y="28" width="64" height="64" rx="20" fill="url(#bg)"/><text class="m" x="60.0" y="65.5" text-anchor="middle" font-size="22" font-weight="800" fill="#FFFFFF">LL</text><text x="110" y="62" font-size="30" font-weight="800" fill="#F5F3FF" letter-spacing="-.8">LaborLoom</text><text class="m" x="111" y="86" font-size="12" font-weight="700" fill="#9A8BFF" letter-spacing=".8">WEB PLATFORM</text><text x="30" y="128" font-size="15" fill="#F5F3FF" opacity=".92">Created a platform connecting contractors</text><text x="30" y="151" font-size="15" fill="#F5F3FF" opacity=".92">and laborers. Built the frontend using</text><text x="30" y="174" font-size="15" fill="#F5F3FF" opacity=".92">React.js and Tailwind CSS.</text><rect x="28" y="204" width="384" height="148" rx="16" fill="#0C0D1F" fill-opacity="0.6" stroke="#FFFFFF" stroke-opacity="0.08000000000000002"/><circle cx="44" cy="219" r="3.8" fill="#FF8FA3"/><circle cx="57" cy="219" r="3.8" fill="#FFB98A"/><circle cx="70" cy="219" r="3.8" fill="#4FE3C1"/><rect x="114" y="216" width="150" height="22" rx="11" fill="#F5F3FF" opacity=".08"/><text class="m" x="128" y="231" font-size="10.5" fill="#A9A7CC">search laborers...</text><rect x="274" y="216" width="122" height="22" rx="11" fill="#4FE3C1" fill-opacity=".22" stroke="#4FE3C1" stroke-opacity=".6"/><text class="m" x="335" y="231" text-anchor="middle" font-size="10.5" font-weight="800" fill="#4FE3C1">+50% visibility</text><circle cx="52" cy="261" r="11" fill="#9A8BFF" fill-opacity=".3" stroke="#9A8BFF"/><circle cx="52" cy="258" r="3.6" fill="#9A8BFF"/><path d="M45,267 q7,-8 14,0" stroke="#9A8BFF" stroke-width="2.4" stroke-linecap="round"/><rect x="72" y="253" width="148" height="6" rx="3" fill="#F5F3FF" opacity=".55"/><rect x="72" y="264" width="90" height="5" rx="2.5" fill="#F5F3FF" opacity=".22"/><rect x="334" y="251" width="62" height="22" rx="11" fill="#9A8BFF" fill-opacity=".2" stroke="#9A8BFF" stroke-opacity=".6"/><text x="365" y="266" text-anchor="middle" font-size="11" font-weight="700" fill="#9A8BFF">Hire</text><circle cx="52" cy="293" r="11" fill="#FF8FA3" fill-opacity=".3" stroke="#FF8FA3"/><circle cx="52" cy="290" r="3.6" fill="#FF8FA3"/><path d="M45,299 q7,-8 14,0" stroke="#FF8FA3" stroke-width="2.4" stroke-linecap="round"/><rect x="72" y="285" width="120" height="6" rx="3" fill="#F5F3FF" opacity=".55"/><rect x="72" y="296" width="76" height="5" rx="2.5" fill="#F5F3FF" opacity=".22"/><rect x="334" y="283" width="62" height="22" rx="11" fill="#FF8FA3" fill-opacity=".2" stroke="#FF8FA3" stroke-opacity=".6"/><text x="365" y="298" text-anchor="middle" font-size="11" font-weight="700" fill="#FF8FA3">Hire</text><circle cx="52" cy="325" r="11" fill="#4FE3C1" fill-opacity=".3" stroke="#4FE3C1"/><circle cx="52" cy="322" r="3.6" fill="#4FE3C1"/><path d="M45,331 q7,-8 14,0" stroke="#4FE3C1" stroke-width="2.4" stroke-linecap="round"/><rect x="72" y="317" width="136" height="6" rx="3" fill="#F5F3FF" opacity=".55"/><rect x="72" y="328" width="84" height="5" rx="2.5" fill="#F5F3FF" opacity=".22"/><rect x="334" y="315" width="62" height="22" rx="11" fill="#4FE3C1" fill-opacity=".2" stroke="#4FE3C1" stroke-opacity=".6"/><text x="365" y="330" text-anchor="middle" font-size="11" font-weight="700" fill="#4FE3C1">Hire</text><rect x="30" y="366" width="81" height="30" rx="15.0" fill="#9A8BFF" fill-opacity=".14" stroke="#9A8BFF" stroke-opacity=".5"/><text x="70.5" y="385.2" text-anchor="middle" font-size="12" fill="#F5F3FF" font-weight="600">React.js</text><rect x="119" y="366" width="108" height="30" rx="15.0" fill="#9A8BFF" fill-opacity=".14" stroke="#9A8BFF" stroke-opacity=".5"/><text x="173.0" y="385.2" text-anchor="middle" font-size="12" fill="#F5F3FF" font-weight="600">Tailwind CSS</text><rect x="235" y="366" width="74" height="30" rx="15.0" fill="#9A8BFF" fill-opacity=".14" stroke="#9A8BFF" stroke-opacity=".5"/><text x="272.0" y="385.2" text-anchor="middle" font-size="12" fill="#F5F3FF" font-weight="600">Node.js</text><rect x="317" y="366" width="74" height="30" rx="15.0" fill="#9A8BFF" fill-opacity=".14" stroke="#9A8BFF" stroke-opacity=".5"/><text x="354.0" y="385.2" text-anchor="middle" font-size="12" fill="#F5F3FF" font-weight="600">MongoDB</text></svg>