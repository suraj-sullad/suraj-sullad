<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A67F5" stop-opacity="0.55"/><stop offset=".55" stop-color="#F5688B" stop-opacity="0.35"/><stop offset="1" stop-color="#0FA383" stop-opacity="0.5"/></linearGradient>
