" fill="#7A67F5">Engineering and Technology</text><text class="m" x="24" y="230" font-size="11.5" fill="#6F6A8F">Sep 2024 – May 2025</text><text x="24" y="254" font-size="13" fill="#6F6A8F">Coursework: DSA, Operating Systems,</text><text x="24" y="273" font-size="13" fill="#6F6A8F">DBMS, Web Technologies.</text><rect x="448.5" y="38" width="3" height="22" rx="1.5" fill="#F5688B" opacity=".6"/><clipPath id="c1"><rect x="304" y="58" width="292" height="330" rx="26"/></clipPath><g clip-path="url(#c1)"><rect x="304" y="58" width="292" height="330" fill="#FFF9F4"/><circle cx="567" cy="74" r="175" fill="#FFBFCF" opacity="0.81" filter="url(#blur)"/><circle cx="333" cy="388" r="117" fill="#FFD1B2" opacity="0.45" filter="url(#blur)"/><rect x="304" y="58" width="292" height="330" fill="url(#dg)"/></g><rect x="304" y="58" width="292" height="330" rx="26" fill="#FFFFFF" fill-opacity="0.35"/><rect x="304.75" y="58.75" width="290.5" height="328.5" rx="25.25" stroke="url(#bd)" stroke-width="1.5"/><circle cx="450.0" cy="27" r="17" fill="#FFF9F4" stroke="#F5688B" stroke-width="2.5"/><circle cx="450.0" cy="27" r="11" fill="#F5688B" fill-opacity=".25"/><text class="m" x="450.0" y="31.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#F5688B">02</text><rect x="328" y="80" width="102" height="26" rx="13.0" fill="#F5688B" fill-opacity=".14" stroke="#F5688B" stroke-opacity=".5"/><text x="379.0" y="97.2" text-anchor="middle" font-size="11" fill="#2A2447" font-weight="600">EXPERIENCE</text><text x="328" y="140" font-size="19" font-weight="800" fill="#2A2447" letter-spacing="-.3">Web Development Intern</text><text class="m" x="328" y="168" font-size="11.5" font-weight="700" fill="#F5688B">Tech Fortune Technologies</text><text class="m" x="328" y="188" font-size="11.5" fill="#6F6A8F">Oct 2023 – Nov 2023</text><circle cx="333" cy="208" r="3" fill="#F5688B"/><text x="346" y="212" font-size="12.5" fill="#6F6A8F">Developed responsive web pages</text><text x="346" y="230" font-size="12.5" fill="#6F6A8F">using React.js and Tailwind CSS.</text><circle cx="333" cy="250" r="3" fill="#F5688B"/><text x="346" y="254" font-size="12.5" fill="#6F6A8F">Created frontend components to</text><text x="346" y="272" font-size="12.5" fill="#6F6A8F">connect contractors and laborers.</text><circle cx="333" cy="292" r="3" fill="#F5688B"/><text x="346" y="296" font-size="12.5" fill="#6F6A8F">Worked with Node.js and MongoDB</text><text x="346" y="314" font-size="12.5" fill="#6F6A8F">to manage application data.</text><circle cx="333" cy="334" r="3" fill="#F5688B"/><text x="346" y="338" font-size="12.5" fill="#6F6A8F">Integrated frontend features with</text><text x="346" y="356" font-size="12.5" fill="#6F6A8F">backend APIs.</text><rect x="752.5" y="38" width="3" height="22" rx="1.5" fill="#0FA383" opacity=".6"/><clipPath id="c2"><rect x="608" y="58" width="292" height="330" rx="26"/></clipPath><g clip-path="url(#c2)"><rect x="608" y="58" width="292" height="330" fill="#FFF9F4"/><circle cx="871" cy="74" r="175" fill="#AEEFDA" opacity="0.81" filter="url(#blur)"/><circle cx="637" cy="388" r="117" fill="#FFD1B2" opacity="0.45" filter="url(#blur)"/><rect x="608" y="58" width="292" height="330" fill="url(#dg)"/></g><rect x="608" y="58" width="292" height="330" rx="26" fill="#FFFFFF" fill-opacity="0.35"/><rect x="608.75" y="58.75" width="290.5" height="328.5" rx="25.25" stroke="url(#bd)" stroke-width="1.5"/><circle cx="754.0" cy="27" r="17" fill="#FFF9F4" stroke="#0FA383" stroke-width="2.5"/><circle cx="754.0" cy="27" r="11" fill="#0FA383" fill-opacity=".25"/><text class="m" x="754.0" y="31.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#0FA383">03</text><rect x="632" y="80" width="132" height="26" rx="13.0" fill="#0FA383" fill-opacity=".14" stroke="#0FA383" stroke-opacity=".5"/><text x="698.0" y="97.2" text-anchor="middle" font-size="11" fill="#2A2447" font-weight="600">CERTIFICATIONS</text><text x="632" y="140" font-size="19" font-weight="800" fill="#2A2447" letter-spacing="-.3">Certifications</text><rect x="632" y="156" width="4" height="4" rx="2" fill="#0FA383"/><text x="644" y="168" font-size="14" font-weight="700" fill="#2A2447">C Programming Course</text><text class="m" x="644" y="187" font-size="11.5" font-weight="700" fill="#0FA383">Udemy</text><rect x="632" y="205" width="4" height="4" rx="2" fill="#0FA383"/><text x="644" y="217" font-size="14" font-weight="700" fill="#2A2447">Web Development Internship</text><text x="644" y="236" font-size="14" font-weight="700" fill="#2A2447">Certificate</text><text class="m" x="644" y="255" font-size="11.5" font-weight="700" fill="#0FA383">Tech Fortune Technologies</text></svg>