<filter id="soft" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="9"/></filter>
<linearGradient id="tg" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6C5CFF"/><stop offset=".55" stop-color="#FF6F91"/><stop offset="1" stop-color="#FF9E5E"/></linearGradient>
<linearGradient id="bd" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#7A67F5" stop-opacity="0.55"/><stop offset=".55" stop-color="#F5688B" stop-opacity="0.35"/><stop offset="1" stop-color="#0FA383" stop-opacity="0.5"/></linearGradient>
<linearGradient id="hl" x1="0" x2="1"><stop offset="0" stop-color="#fff" stop-opacity="0"/><stop offset=".5" stop-color="#fff" stop-opacity="0.0"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></linearGradient>
