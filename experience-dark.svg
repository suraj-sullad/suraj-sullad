text class="m" x="24" y="210" font-size="11.5" font-weight="700" fill="#9A8BFF">Engineering and Technology</text><text class="m" x="24" y="230" font-size="11.5" fill="#A9A7CC">Sep 2024 – Present</text><text x="24" y="254" font-size="13" fill="#A9A7CC">Coursework: DSA, Operating Systems,</text><text x="24" y="273" font-size="13" fill="#A9A7CC">DBMS, Web Technologies.</text><rect x="448.5" y="38" width="3" height="22" rx="1.5" fill="#FF8FA3" opacity=".6"/><clipPath id="c1"><rect x="304" y="58" width="292" height="330" rx="26"/></clipPath><g clip-path="url(#c1)"><rect x="304" y="58" width="292" height="330" fill="#14152A"/><circle cx="567" cy="74" r="175" fill="#FF6F8E" opacity="0.45" filter="url(#blur)"/><circle cx="333" cy="388" r="117" fill="#FF9E6B" opacity="0.25" filter="url(#blur)"/><rect x="304" y="58" width="292" height="330" fill="url(#dg)"/></g><rect x="304" y="58" width="292" height="330" rx="26" fill="#FFFFFF" fill-opacity="0.045"/><rect x="304.75" y="58.75" width="290.5" height="328.5" rx="25.25" stroke="url(#bd)" stroke-width="1.5"/><rect x="330" y="59" width="240" height="1.2" fill="url(#hl)"/><circle cx="450.0" cy="27" r="17" fill="#14152A" stroke="#FF8FA3" stroke-width="2.5"/><circle cx="450.0" cy="27" r="11" fill="#FF8FA3" fill-opacity=".25"/><text class="m" x="450.0" y="31.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#FF8FA3">02</text><rect x="328" y="80" width="102" height="26" rx="13.0" fill="#FF8FA3" fill-opacity=".14" stroke="#FF8FA3" stroke-opacity=".5"/><text x="379.0" y="97.2" text-anchor="middle" font-size="11" fill="#F5F3FF" font-weight="600">EXPERIENCE</text><text x="328" y="140" font-size="19" font-weight="800" fill="#F5F3FF" letter-spacing="-.3">Web Development Intern</text><text class="m" x="328" y="168" font-size="11.5" font-weight="700" fill="#FF8FA3">Tech Fortune Technologies</text><text class="m" x="328" y="188" font-size="11.5" fill="#A9A7CC">Oct 2025 – Nov 2025</text><circle cx="333" cy="208" r="3" fill="#FF8FA3"/><text x="346" y="212" font-size="12.5" fill="#A9A7CC">Developed responsive web pages</text><text x="346" y="230" font-size="12.5" fill="#A9A7CC">using React.js and Tailwind CSS.</text><circle cx="333" cy="250" r="3" fill="#FF8FA3"/><text x="346" y="254" font-size="12.5" fill="#A9A7CC">Created frontend components to</text><text x="346" y="272" font-size="12.5" fill="#A9A7CC">connect contractors and laborers.</text><circle cx="333" cy="292" r="3" fill="#FF8FA3"/><text x="346" y="296" font-size="12.5" fill="#A9A7CC">Worked with Node.js and MongoDB</text><text x="346" y="314" font-size="12.5" fill="#A9A7CC">to manage application data.</text><circle cx="333" cy="334" r="3" fill="#FF8FA3"/><text x="346" y="338" font-size="12.5" fill="#A9A7CC">Integrated frontend features with</text><text x="346" y="356" font-size="12.5" fill="#A9A7CC">backend APIs.</text><rect x="752.5" y="38" width="3" height="22" rx="1.5" fill="#4FE3C1" opacity=".6"/><clipPath id="c2"><rect x="608" y="58" width="292" height="330" rx="26"/></clipPath><g clip-path="url(#c2)"><rect x="608" y="58" width="292" height="330" fill="#14152A"/><circle cx="871" cy="74" r="175" fill="#2FD3AE" opacity="0.45" filter="url(#blur)"/><circle cx="637" cy="388" r="117" fill="#FF9E6B" opacity="0.25" filter="url(#blur)"/><rect x="608" y="58" width="292" height="330" fill="url(#dg)"/></g><rect x="608" y="58" width="292" height="330" rx="26" fill="#FFFFFF" fill-opacity="0.045"/><rect x="608.75" y="58.75" width="290.5" height="328.5" rx="25.25" stroke="url(#bd)" stroke-width="1.5"/><rect x="634" y="59" width="240" height="1.2" fill="url(#hl)"/><circle cx="754.0" cy="27" r="17" fill="#14152A" stroke="#4FE3C1" stroke-width="2.5"/><circle cx="754.0" cy="27" r="11" fill="#4FE3C1" fill-opacity=".25"/><text class="m" x="754.0" y="31.5" text-anchor="middle" font-size="12.5" font-weight="800" fill="#4FE3C1">03</text><rect x="632" y="80" width="132" height="26" rx="13.0" fill="#4FE3C1" fill-opacity=".14" stroke="#4FE3C1" stroke-opacity=".5"/><text x="698.0" y="97.2" text-anchor="middle" font-size="11" fill="#F5F3FF" font-weight="600">CERTIFICATIONS</text><text x="632" y="140" font-size="19" font-weight="800" fill="#F5F3FF" letter-spacing="-.3">Certifications</text><rect x="632" y="156" width="4" height="4" rx="2" fill="#4FE3C1"/><text x="644" y="168" font-size="14" font-weight="700" fill="#F5F3FF">C Programming Course</text><text class="m" x="644" y="187" font-size="11.5" font-weight="700" fill="#4FE3C1">Udemy</text><rect x="632" y="205" width="4" height="4" rx="2" fill="#4FE3C1"/><text x="644" y="217" font-size="14" font-weight="700" fill="#F5F3FF">Web Development Internship</text><text x="644" y="236" font-size="14" font-weight="700" fill="#F5F3FF">Certificate</text><text class="m" x="644" y="255" font-size="11.5" font-weight="700" fill="#4FE3C1">Tech Fortune Technologies</text></svg>
